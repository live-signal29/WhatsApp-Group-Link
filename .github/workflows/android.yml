name: Android Build & Release CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  VERSION_OFFSET: 100
  PLAY_PACKAGE: com.aistudio.whatsappgrouplinks.pkrzla

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------------------------------------------------------
      # DEBUG KEYSTORE
      # ---------------------------------------------------------
      - name: Create debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ---------------------------------------------------------
      # RELEASE KEYSTORE
      # ---------------------------------------------------------
      - name: Setup Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using GitHub release keystore"

            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

          elif [ -f "$GITHUB_WORKSPACE/upload-keystore.jks" ]; then
            echo "Using repository upload-keystore.jks"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=whatsapp123" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASSWORD=whatsapp123" >> "$GITHUB_ENV"

          else
            echo "No release keystore found."
            echo "Generating upload keystore..."

            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
              -storepass "whatsapp123" \
              -alias "upload" \
              -keypass "whatsapp123" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=WhatsApp Group Links, OU=Mobile, O=AI Studio, L=Mountain View, ST=California, C=US"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=whatsapp123" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASSWORD=whatsapp123" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------
      # VERSION
      # ---------------------------------------------------------
      - name: Compute version
        run: |
          echo "VERSION_CODE=$(( ${{ github.run_number }} + VERSION_OFFSET ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$(( ${{ github.run_number }} + VERSION_OFFSET ))" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # BUILD DEBUG APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            --stacktrace

      # ---------------------------------------------------------
      # BUILD RELEASE AAB + APK
      # IMPORTANT: Explicit release signing properties
      # ---------------------------------------------------------
      - name: Build Release AAB and APK
        run: |
          ./gradlew clean

          ./gradlew bundleRelease assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASSWORD" \
            --stacktrace

      # ---------------------------------------------------------
      # VERIFY AAB SIGNATURE
      # ---------------------------------------------------------
      - name: Verify Release AAB Signature
        run: |
          echo "Checking release AAB..."

          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB not found!"
            exit 1
          fi

          echo "AAB: $AAB_FILE"

          jarsigner -verify -verbose -certs "$AAB_FILE"

          echo "Release AAB signature verification completed."

      # ---------------------------------------------------------
      # VERIFY APK SIGNATURE
      # ---------------------------------------------------------
      - name: Verify Release APK Signature
        run: |
          echo "Checking release APK..."

          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          echo "APK: $APK_FILE"

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner verify --verbose "$APK_FILE"

          echo "Release APK signature verification completed."

      # ---------------------------------------------------------
      # UPLOAD DEBUG APK
      # ---------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Group-Links-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # ---------------------------------------------------------
      # UPLOAD RELEASE AAB
      # ---------------------------------------------------------
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Group-Links-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ---------------------------------------------------------
      # UPLOAD RELEASE APK
      # ---------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Group-Links-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # PLAY STORE INTERNAL TESTING
      # ---------------------------------------------------------
      - name: Upload AAB to Play Store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
