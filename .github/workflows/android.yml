name: Android Build & Release CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Har build pe versionCode badhta hai (Play Store ko higher version chahiye).
  # Offset 100 = pehle jo bhi upload hua ho usse upar rahe. Zarurat ho to badha do.
  VERSION_OFFSET: 100
  PLAY_PACKAGE: com.aistudio.whatsappgrouplinks.pkrzla

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' || hashFiles('upload-keystore.jks') != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create debug.keystore (gitignored, needed by Gradle)
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using ANDROID_KEYSTORE_BASE64 from GitHub Secrets"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYSTORE_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYSTORE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "upload-keystore.jks" ]; then
            echo "Using repository upload-keystore.jks for release signing"
            echo "KEYSTORE_PATH=${{ github.workspace }}/upload-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=whatsapp123" >> $GITHUB_ENV
            echo "KEYSTORE_ALIAS=upload" >> $GITHUB_ENV
            echo "KEYSTORE_KEY_PASSWORD=whatsapp123" >> $GITHUB_ENV
          else
            echo "Generating release upload keystore..."
            keytool -genkeypair -v -keystore upload-keystore.jks \
              -storepass "whatsapp123" -alias "upload" -keypass "whatsapp123" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=WhatsApp Group Links, OU=Mobile, O=AI Studio, L=Mountain View, ST=California, C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/upload-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=whatsapp123" >> $GITHUB_ENV
            echo "KEYSTORE_ALIAS=upload" >> $GITHUB_ENV
            echo "KEYSTORE_KEY_PASSWORD=whatsapp123" >> $GITHUB_ENV
          fi

      - name: Compute version
        run: |
          echo "VERSION_CODE=$(( ${{ github.run_number }} + VERSION_OFFSET ))" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.$(( ${{ github.run_number }} + VERSION_OFFSET ))" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME --stacktrace

      - name: Build Release Bundle (AAB) & Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ env.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Group-Links-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Group-Links-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Group-Links-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ---- Play Store upload (billing / in-app products ke liye app Play Console pe chahiye) ----
      # Sirf tab chalega jab: main branch push + real keystore + Play service account secret ho.
      - name: Upload AAB to Play Store (internal testing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
